<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff6ef">
<title>今天吃什麼？｜選擇困難救星</title>
<style>
:root{--ink:#45342f;--muted:#89766e;--peach:#f77968;--cream:#fff8f2;--line:#f2ded3;--shadow:0 18px 45px #b96d4b16}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#ffe3d7 0,transparent 36%),radial-gradient(circle at 95% 20%,#fff0bb 0,transparent 30%),var(--cream);font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:var(--ink);min-height:100vh}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f7aa77;outline-offset:3px}.wrap{max-width:1060px;margin:auto;padding:30px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.03em}.pill{font-size:12px;background:white;padding:9px 13px;border:1px solid var(--line);border-radius:30px;color:var(--muted)}.hero{text-align:center;padding:52px 12px 30px}.hero .art{font-size:66px;filter:drop-shadow(0 12px 8px #e7a88250)}h1{font-size:clamp(34px,6vw,56px);margin:10px 0 8px;letter-spacing:-.04em}.hero p{color:var(--muted);line-height:1.8}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#ffffffd9;border:1px solid white;border-radius:28px;box-shadow:var(--shadow);padding:26px}.panel h2{font-size:21px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin:0 0 22px}.field{margin-bottom:19px}.field label{display:block;font-weight:750;margin-bottom:9px;font-size:14px}select{width:100%;border:1px solid var(--line);background:#fffaf7;border-radius:13px;padding:13px 14px;color:var(--ink)}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary{background:var(--peach);color:white;border:0;border-radius:14px;padding:14px 20px;font-weight:800;box-shadow:0 8px 16px #f7796840}.primary:hover{background:#eb6756}.secondary{background:#fff4ec;color:#9a5347;border:1px solid #f5d4c6;border-radius:14px;padding:13px 16px;font-weight:700}.secondary:hover{background:#ffe7da}.result{min-height:425px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.dish-icon{font-size:94px;line-height:1.5;transition:transform .2s}.dish-icon.spin{animation:bounce .2s infinite alternate}@keyframes bounce{to{transform:translateY(-10px) rotate(8deg)}}.result h3{font-size:30px;margin:8px 0}.result p{color:var(--muted);line-height:1.6}.tag{display:inline-block;background:#fff1e7;color:#a65d4b;border-radius:30px;padding:7px 11px;font-size:12px;margin:4px}.result .actions{justify-content:center;margin-top:18px}.lower{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.list{display:grid;gap:9px;max-height:360px;overflow:auto}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff8f3;border-radius:14px;padding:12px}.item .info{display:flex;align-items:center;gap:10px;min-width:0}.item .emoji{font-size:27px}.item strong{display:block;font-size:14px}.item small{color:var(--muted)}.tiny{border:0;border-radius:10px;background:white;padding:8px 10px;color:#b45c50}.empty{color:var(--muted);font-size:14px;line-height:1.7}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:32px}.notice{min-height:22px;font-size:13px;color:#aa5b49;margin-top:10px}.counter{font-size:12px;color:var(--muted);margin-top:9px}@media(max-width:720px){.layout,.lower{grid-template-columns:1fr}.hero{padding-top:30px}.panel{padding:22px}.result{min-height:360px}.wrap{padding:20px 14px 50px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main class="wrap"><header class="top"><div class="brand">🍑 吃什麼研究所</div><span class="pill">你的每日美食靈感</span></header><section class="hero"><div class="art" aria-hidden="true">🍜🥟🍔</div><h1>今天吃什麼？</h1><p>肚子餓了，腦袋卻一片空白？<br>把選擇困難交給我，今天這餐就這樣決定！</p></section><section class="layout"><div class="panel"><h2>✨ 告訴我你的心情</h2><p class="sub">選幾個條件，或全部不限，讓命運決定</p><div class="field"><label for="meal">🕒 用餐時段</label><select id="meal"><option value="all">都可以</option><option>早餐</option><option>午餐</option><option>晚餐</option><option>宵夜</option></select></div><div class="field"><label for="budget">💰 今天的預算</label><select id="budget"><option value="all">不限制預算</option><option value="low">100 元以下</option><option value="mid">101～200 元</option><option value="high">201 元以上</option></select></div><div class="field"><label for="cuisine">🌏 想吃哪種料理？</label><select id="cuisine"><option value="all">都可以</option><option>台式</option><option>日式</option><option>韓式</option><option>美式</option><option>義式</option><option>東南亞</option></select></div><div class="field"><label for="kind">🍽️ 今天想吃什麼類型？</label><select id="kind"><option value="all">都可以</option><option>飯類</option><option>麵類</option><option>輕食</option><option>炸物</option><option>湯品</option></select></div><div class="actions"><button id="pick" class="primary">🎲 幫我決定！</button><button id="surprise" class="secondary">🤷 完全沒想法</button></div><div class="counter" id="count" aria-live="polite"></div></div><div class="panel result" aria-live="polite"><div id="dishIcon" class="dish-icon" aria-hidden="true">🍽️</div><h3 id="dishName">等待美食降臨</h3><p id="dishDesc">選好條件後，按下「幫我決定！」<br>你的下一餐就有著落了。</p><div id="tags"></div><div class="actions" id="resultActions" hidden><button class="primary" id="again">🔄 再抽一次</button><button class="secondary" id="favorite">♡ 加入收藏</button></div><div class="notice" id="notice" role="status"></div></div></section><section class="lower"><div class="panel"><h2>💗 我的口袋名單</h2><p class="sub">喜歡的餐點先存起來，下次就不用想了</p><div class="list" id="favorites"></div></div><div class="panel"><h2>🕰️ 最近抽過什麼？</h2><p class="sub">最多保留最近 10 次推薦紀錄</p><div class="list" id="history"></div><div style="margin-top:16px"><button class="secondary" id="clearHistory">清除紀錄</button></div></div></section><footer class="footer">Made with ♡ and Vibe Coding · 價格為示範估計，非即時店家資訊</footer></main>
<script>
'use strict';
const raw=[
['飯糰',55,'台式','飯類','早餐','🍙'],['蛋餅',50,'台式','輕食','早餐','🥚'],['蘿蔔糕',60,'台式','輕食','早餐','🥢'],['飯糰配豆漿',80,'台式','飯類','早餐','🍙'],['火腿三明治',75,'美式','輕食','早餐','🥪'],['貝果',90,'美式','輕食','早餐','🥯'],['美式早午餐',230,'美式','輕食','早餐','🍳'],['鮪魚吐司',65,'美式','輕食','早餐','🥪'],['牛肉麵',170,'台式','麵類','午餐 晚餐','🍜'],['滷肉飯',75,'台式','飯類','午餐 晚餐 宵夜','🍚'],['雞腿便當',130,'台式','飯類','午餐 晚餐','🍱'],['排骨飯',125,'台式','飯類','午餐 晚餐','🍚'],['肉燥乾麵',80,'台式','麵類','午餐 晚餐 宵夜','🍝'],['鹽酥雞',140,'台式','炸物','晚餐 宵夜','🍗'],['雞排',95,'台式','炸物','晚餐 宵夜','🍗'],['貢丸湯',60,'台式','湯品','午餐 晚餐 宵夜','🥣'],['麻辣燙',160,'台式','湯品','午餐 晚餐 宵夜','🍲'],['小火鍋',220,'台式','湯品','午餐 晚餐','🍲'],['關東煮',95,'日式','湯品','午餐 晚餐 宵夜','🍢'],['拉麵',240,'日式','麵類','午餐 晚餐','🍜'],['烏龍麵',180,'日式','麵類','午餐 晚餐','🍜'],['豬排丼飯',195,'日式','飯類','午餐 晚餐','🍛'],['咖哩飯',160,'日式','飯類','午餐 晚餐','🍛'],['壽司',260,'日式','飯類','午餐 晚餐','🍣'],['炸蝦定食',280,'日式','炸物','午餐 晚餐','🍤'],['韓式拌飯',190,'韓式','飯類','午餐 晚餐','🍚'],['泡菜鍋',240,'韓式','湯品','午餐 晚餐','🍲'],['韓式炸雞',290,'韓式','炸物','晚餐 宵夜','🍗'],['韓式泡麵',110,'韓式','麵類','午餐 晚餐 宵夜','🍜'],['紫菜飯捲',150,'韓式','飯類','午餐 晚餐','🍙'],['起司漢堡',180,'美式','輕食','午餐 晚餐 宵夜','🍔'],['炸雞薯條',210,'美式','炸物','午餐 晚餐 宵夜','🍟'],['雞肉沙拉',180,'美式','輕食','午餐 晚餐','🥗'],['熱狗堡',110,'美式','輕食','午餐 宵夜','🌭'],['披薩',280,'義式','輕食','午餐 晚餐 宵夜','🍕'],['義大利肉醬麵',220,'義式','麵類','午餐 晚餐','🍝'],['奶油培根義大利麵',230,'義式','麵類','午餐 晚餐','🍝'],['燉飯',260,'義式','飯類','午餐 晚餐','🍚'],['南瓜濃湯',110,'義式','湯品','午餐 晚餐','🥣'],['越南河粉',190,'東南亞','麵類','午餐 晚餐','🍜'],['泰式打拋豬飯',170,'東南亞','飯類','午餐 晚餐','🍚'],['海南雞飯',180,'東南亞','飯類','午餐 晚餐','🍗'],['泰式酸辣湯',160,'東南亞','湯品','午餐 晚餐','🍲'],['越式春捲',130,'東南亞','輕食','午餐 晚餐','🥬'],['泰式炒河粉',190,'東南亞','麵類','午餐 晚餐','🍝']];
const dishes=raw.map(([name,price,cuisine,kind,meals,emoji],id)=>({id,name,price,cuisine,kind,meals:meals.split(' '),emoji}));
const $=id=>document.getElementById(id);const storage={read(key,def){try{const x=JSON.parse(localStorage.getItem(key));return Array.isArray(x)?x:def}catch{return def}},write(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch{}}};
let favorites=storage.read('foodapp-favorites-v1',[]).filter(id=>Number.isInteger(id)&&dishes[id]);let history=storage.read('foodapp-history-v1',[]).filter(id=>Number.isInteger(id)&&dishes[id]).slice(0,10);let current=null,lastId=null,busy=false;
function matches(d){const meal=$('meal').value,budget=$('budget').value,cuisine=$('cuisine').value,kind=$('kind').value;return (meal==='all'||d.meals.includes(meal))&&(budget==='all'||(budget==='low'&&d.price<=100)||(budget==='mid'&&d.price>=101&&d.price<=200)||(budget==='high'&&d.price>=201))&&(cuisine==='all'||d.cuisine===cuisine)&&(kind==='all'||d.kind===kind)}
function updateCount(){$('count').textContent=`目前有 ${dishes.filter(matches).length} 道餐點符合條件`}
function setText(name,desc,emoji){$('dishName').textContent=name;$('dishDesc').textContent=desc;$('dishIcon').textContent=emoji}
function show(d){current=d;lastId=d.id;setText(d.name,`預估 NT$ ${d.price} · 今天就吃這個吧！`,d.emoji);$('tags').replaceChildren();[d.cuisine,d.kind,...d.meals].forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;$('tags').append(s)});$('resultActions').hidden=false;$('notice').textContent='';history.unshift(d.id);history=history.slice(0,10);storage.write('foodapp-history-v1',history);renderLists();updateFavorite()}
function updateFavorite(){$('favorite').textContent=current&&favorites.includes(current.id)?'♥ 已收藏（點擊取消）':'♡ 加入收藏'}
function pick(){if(busy)return;const eligible=dishes.filter(matches);if(!eligible.length){current=null;setText('找不到符合的餐點','試著放寬預算或改變料理類型，再抽一次！','🥺');$('tags').replaceChildren();$('resultActions').hidden=true;$('notice').textContent='目前沒有符合條件的餐點';return}busy=true;$('pick').disabled=true;$('again').disabled=true;$('notice').textContent='美食抽選中…';$('dishIcon').classList.add('spin');let steps=0;const ticker=setInterval(()=>{const d=eligible[Math.floor(Math.random()*eligible.length)];$('dishIcon').textContent=d.emoji;steps++;if(steps>=11){clearInterval(ticker);const pool=eligible.length>1?eligible.filter(d=>d.id!==lastId):eligible;const chosen=pool[Math.floor(Math.random()*pool.length)];$('dishIcon').classList.remove('spin');show(chosen);busy=false;$('pick').disabled=false;$('again').disabled=false}},85)}
function renderLists(){const f=$('favorites'),h=$('history');f.replaceChildren();h.replaceChildren();if(!favorites.length){const p=document.createElement('p');p.className='empty';p.textContent='還沒有收藏，抽到喜歡的餐點就按愛心吧！';f.append(p)}favorites.forEach(id=>addItem(f,dishes[id],'移除',()=>{favorites=favorites.filter(x=>x!==id);storage.write('foodapp-favorites-v1',favorites);renderLists();updateFavorite()}));if(!history.length){const p=document.createElement('p');p.className='empty';p.textContent='還沒有抽選紀錄，快去抽第一餐！';h.append(p)}history.forEach(id=>addItem(h,dishes[id],null,null))}
function addItem(root,d,buttonText,callback){const item=document.createElement('div');item.className='item';const info=document.createElement('div');info.className='info';const emoji=document.createElement('span');emoji.className='emoji';emoji.textContent=d.emoji;const words=document.createElement('div');const strong=document.createElement('strong');strong.textContent=d.name;const small=document.createElement('small');small.textContent=`${d.cuisine} · 約 NT$ ${d.price}`;words.append(strong,small);info.append(emoji,words);item.append(info);if(buttonText){const b=document.createElement('button');b.className='tiny';b.textContent=buttonText;b.setAttribute('aria-label',`${buttonText}${d.name}`);b.onclick=callback;item.append(b)}root.append(item)}
$('pick').addEventListener('click',pick);$('again').addEventListener('click',pick);$('surprise').addEventListener('click',()=>{if(busy)return;['meal','budget','cuisine','kind'].forEach(id=>$(id).value='all');updateCount();pick()});$('favorite').addEventListener('click',()=>{if(!current)return;if(favorites.includes(current.id))favorites=favorites.filter(x=>x!==current.id);else favorites.unshift(current.id);storage.write('foodapp-favorites-v1',favorites);renderLists();updateFavorite()});$('clearHistory').addEventListener('click',()=>{history=[];storage.write('foodapp-history-v1',history);renderLists()});['meal','budget','cuisine','kind'].forEach(id=>$(id).addEventListener('change',updateCount));updateCount();renderLists();
</script></body></html>

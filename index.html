<body><main class="wrap"><header class="top"><div class="brand">🍑 吃什麼研究所</div><span class="pill">你的每日美食靈感</span></header><section class="hero"><div class="art" aria-hidden="true">🍜🥟🍔</div><h1>今天吃什麼？</h1><p>肚子餓了，腦袋卻一片空白？<br>把選擇困難交給我，今天這餐就這樣決定！</p></section><section class="layout"><div class="panel"><h2>✨ 告訴我你的心情</h2><p class="sub">選幾個條件，或全部不限，讓命運決定</p><div class="field"><label for="meal">🕒 用餐時段</label><select id="meal"><option value="all">都可以</option><option>早餐</option><option>午餐</option><option>晚餐</option><option>宵夜</option></select></div><div class="field"><label for="budget">💰 今天的預算</label><select id="budget"><option value="all">不限制預算</option><option value="low">100 元以下</option><option value="mid">101～200 元</option><option value="high">201～300 元</option><option value="premium">301～500 元</option><option value="luxury">501～800 元</option><option value="upper">801～1000 元</option><option value="unlimited">1001 元以上</option></select></div><div class="field"><label for="cuisine">🌏 想吃哪種料理？</label><select id="cuisine"><option value="all">都可以</option><option>台式</option><option>日式</option><option>韓式</option><option>美式</option><option>義式</option><option>法式</option><option>中式</option><option>港式</option><option>泰式</option><option>東南亞</option><option>其他</option></select></div><div class="field"><label for="kind">🍽️ 今天想吃什麼類型？</label><select id="kind"><option value="all">都可以</option><option>飯類</option><option>麵類</option><option>輕食</option><option>炸物</option><option>湯品</option><option>火鍋</option><option>燒烤</option><option>壽司／生魚片</option><option>速食</option><option>早午餐</option><option>甜點</option><option>小吃</option><option>法式餐點</option><option>其他</option></select></div><div class="actions"><button id="pick" class="primary">🎲 幫我決定！</button><button id="surprise" class="secondary">🤷 完全沒想法</button></div><div class="counter" id="count" aria-live="polite"></div></div><div class="panel result" aria-live="polite"><div id="dishIcon" class="dish-icon" aria-hidden="true">🍽️</div><h3 id="dishName" const $=id=>document.getElementById(id);const storage={read(key,def){try{const x=JSON.parse(localStorage.getItem(key));return Array.isArray(x)?x:def}catch{return def}},write(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch{}}};

function matches(d){const meal=$('meal').value,budget=$('budget').value,cuisine=$('cuisine').value,kind=$('kind').value;return (meal==='all'||d.meals.includes(meal))&&(budget==='all'||(budget==='low'&&d.price<=100)||(budget==='mid'&&d.price>=101&&d.price<=200)||(budget==='high'&&d.price>=201&&d.price<=300)||(budget==='premium'&&d.price>=301&&d.price<=500)||(budget==='luxury'&&d.price>=501&&d.price<=800)||(budget==='upper'&&d.price>=801&&d.price<=1000)||(budget==='unlimited'&&d.price>=1001))&&(cuisine==='all'||d.cuisine===cuisine)&&(kind==='all'||d.kind===kind)}

function renderLists(){const f=$('favorites'),h=$('history');f.replaceChildren();h.replaceChildren();if(!favorites.length){const p=document.createElement('p');p.className='empty';p.textContent='還沒有收藏，抽到喜歡的餐點就按愛心吧！';f.append(p)}favorites.forEach(id=>addItem(f,byId(id),'移除',()=>{favorites=favorites.filter(x=>x!==id);storage.write('foodapp-favorites-v1',favorites);renderLists();updateFavorite()}));if(!history.length){const p=document.createElement('p');p.className='empty';p.textContent='還沒有抽選紀錄，快去抽第一餐！';h.append(p)}history.forEach(id=>addItem(h,byId(id),null,null))}
